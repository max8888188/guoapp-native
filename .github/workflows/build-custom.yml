name: Build Custom APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download guoapp 2.0.1 source
        run: |
          set -euo pipefail
          curl -sL -o src.zip https://codeload.github.com/Xanerix/guoapp/zip/refs/tags/app-v2.0.1-113
          unzip -q src.zip
          mv guoapp-app-v2.0.1-113 app
          ls -d app

      - name: Apply patch
        run: python3 patch_guoapp.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/native/go.mod
          cache-dependency-path: app/native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true

      - name: Setup NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Build native (Go)
        working-directory: app
        run: python3 scripts/build_native.py --platform android

      - name: Flutter build
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --split-per-abi --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7